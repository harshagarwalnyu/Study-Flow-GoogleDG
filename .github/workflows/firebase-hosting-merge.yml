# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_main:
    name: firebase-live-verify-main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # vitest 5 needs Node >= 22.12; do not depend on the runner image's default.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test server
        run: bun run --cwd server test
      - name: Build web
        run: bun run --cwd web build

  build_and_deploy:
    name: firebase-live-deploy
    needs: verify_main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GDG_AI_COMPANION != '' }}
      # Set the repo variable FIREBASE_LIVE_DEPLOY=true where main must reach production: a missing
      # secret then fails the run instead of passing green with nothing deployed. Unset (forks,
      # copies without Firebase) = build only, by choice.
      LIVE_DEPLOY_REQUIRED: ${{ vars.FIREBASE_LIVE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build web app
        run: bun run --cwd web build
      - name: Fail when a required live deploy has no service account
        if: env.HAS_FIREBASE_SA != 'true' && env.LIVE_DEPLOY_REQUIRED == 'true'
        run: |
          echo "::error::FIREBASE_LIVE_DEPLOY is true but FIREBASE_SERVICE_ACCOUNT_GDG_AI_COMPANION is not set; nothing was deployed."
          exit 1
      - name: Skip deploy (live deploy not enabled for this repo)
        if: env.HAS_FIREBASE_SA != 'true' && env.LIVE_DEPLOY_REQUIRED != 'true'
        run: echo "::notice::No Firebase service account and FIREBASE_LIVE_DEPLOY is not true; built the site, skipped the deploy."
      - if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GDG_AI_COMPANION }}
          channelId: live
          projectId: gdg-ai-companion
